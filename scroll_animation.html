<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Animation</title>
    <style>
        body {
            background: #000;
            height: 1000vh; /* Large height to allow for a lot of scrolling */
            margin: 0;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <canvas id="scroll-animation"></canvas>

    <script>
        const html = document.documentElement;
        const canvas = document.getElementById("scroll-animation");
        const context = canvas.getContext("2d");

        const frameCount = 300;
        const images = [];

        // Function to get the path of a given frame
        const currentFrame = index => (
            `./scroll-animation-assets/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`
        );

        // Preload all images and push to array for quick access
        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        // Wait for the first image to load so we can set canvas dimensions
        images[0].onload = () => {
            canvas.width = images[0].width;
            canvas.height = images[0].height;
            context.drawImage(images[0], 0, 0);
        };

        let currentFrameIndex = 0;

        window.addEventListener('scroll', () => {  
            const scrollTop = html.scrollTop;
            const maxScrollTop = html.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            // Determine which frame we should be on
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );

            // Use requestAnimationFrame for smooth drawing
            requestAnimationFrame(() => {
                if (frameIndex !== currentFrameIndex) {
                    currentFrameIndex = frameIndex;
                    if (images[frameIndex] && images[frameIndex].complete) {
                        context.drawImage(images[frameIndex], 0, 0);
                    }
                }
            });
        });
    </script>
</body>
</html>
